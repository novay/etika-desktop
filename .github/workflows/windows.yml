name: Windows Desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Etika.Core.Tests
      - run: dotnet publish src/Etika.Desktop/Etika.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o artifacts/Etika.Desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Etika.Desktop-win-x64
          path: artifacts/Etika.Desktop
          if-no-files-found: error
