name: Windows Desktop
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Etika.Core.Tests
      - run: dotnet publish src/Etika.Desktop/Etika.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o artifacts/Etika.Desktop
      - name: Verify application startup
        shell: pwsh
        run: ./scripts/Test-Startup.ps1 -PublishDirectory artifacts/Etika.Desktop
      - name: Build Visual Studio Debug solution
        run: dotnet build Etika.Desktop.sln -c Debug -p:Platform=x64
      - name: Verify Debug application startup
        shell: pwsh
        run: ./scripts/Test-Startup.ps1 -PublishDirectory src/Etika.Desktop/bin/x64/Debug/net10.0-windows10.0.26100.0/win-x64 -DiagnosticsDirectory artifacts/debug-startup-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Etika.Desktop-startup-diagnostics
          path: |
            artifacts/startup-diagnostics
            artifacts/debug-startup-diagnostics
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Etika.Desktop-win-x64
          path: artifacts/Etika.Desktop
          if-no-files-found: error
